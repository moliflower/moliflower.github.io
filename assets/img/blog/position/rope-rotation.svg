<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 92 960 378" role="img" aria-labelledby="title desc">
  <title id="title">RoPE 比较两根位置指针的角度差，而不是绝对朝向</title>
  <desc id="desc">位置 2 与 5、位置 7 与 10 虽然绝对位置不同，但间隔都为 3，因此旋转后的查询和键保持相同角度差。不同维度使用快慢不同的指针覆盖多种距离尺度。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--wash)"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="context-stroke"/></marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c;--coral-soft:#ffedd5}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c;--coral-soft:#7c2d12}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}.muted{fill:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.stage{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.axis{stroke:var(--border);stroke-width:1.5}.q{stroke:var(--blue)}.k{stroke:var(--amber)}.arc{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round}
    </style>
  </defs>
  <rect x="0" y="92" width="960" height="378" rx="28" fill="url(#paper)"/>

  <g transform="translate(44 108)">
    <rect class="stage" width="570" height="344" rx="20"/>
    <text x="24" y="34" font-size="14" font-weight="700">同一个相对距离 Δ = 3</text>
    <g transform="translate(145 183)"><circle r="112" fill="var(--blue-soft)" opacity=".24" stroke="var(--border)" stroke-width="2"/><circle r="6" fill="var(--text)"/><path class="axis" d="M-112 0H112M0-112V112"/>
      <g stroke-width="7" stroke-linecap="round"><path class="q" d="M0 0L86 50"/><circle cx="86" cy="50" r="8" fill="var(--blue)"/><path class="k" d="M0 0L-12 99"/><circle cx="-12" cy="99" r="8" fill="var(--amber)"/></g>
      <path class="arc" d="M58 34A67 67 0 0 1-8 66"/><text x="48" y="86" text-anchor="middle" font-size="13" fill="var(--teal)">3θ</text>
      <rect x="-102" y="-154" width="204" height="30" rx="9" fill="var(--panel)"/><text x="0" y="-134" text-anchor="middle" class="mono" font-size="13">m = 2 · n = 5</text><text x="78" y="33" font-size="12" fill="var(--blue)">R₂q</text><text x="-48" y="103" font-size="12" fill="var(--amber)">R₅k</text>
    </g>
    <g transform="translate(425 183)"><circle r="112" fill="var(--amber-soft)" opacity=".25" stroke="var(--border)" stroke-width="2"/><circle r="6" fill="var(--text)"/><path class="axis" d="M-112 0H112M0-112V112"/>
      <g stroke-width="7" stroke-linecap="round"><path class="q" d="M0 0L-73-68"/><circle cx="-73" cy="-68" r="8" fill="var(--blue)"/><path class="k" d="M0 0L25-96"/><circle cx="25" cy="-96" r="8" fill="var(--amber)"/></g>
      <path class="arc" d="M-48-45A67 67 0 0 1 17-64"/><text x="-17" y="-76" text-anchor="middle" font-size="13" fill="var(--teal)">3θ</text>
      <rect x="-102" y="-154" width="204" height="30" rx="9" fill="var(--panel)"/><text x="0" y="-134" text-anchor="middle" class="mono" font-size="13">m = 7 · n = 10</text><text x="-90" y="-75" font-size="12" fill="var(--blue)">R₇q</text><text x="33" y="-98" font-size="12" fill="var(--amber)">R₁₀k</text>
    </g>
    <g transform="translate(24 305)"><rect width="522" height="24" rx="8" fill="var(--teal-soft)"/><text x="261" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="var(--teal)">整体平移 +5，点积中的相对旋转仍然相同</text></g>
  </g>

  <g transform="translate(642 108)">
    <rect class="stage" width="274" height="344" rx="20"/>
    <text x="22" y="34" font-size="14" font-weight="700">每对维度是一只不同速度的表</text>
    <text x="22" y="57" class="muted" font-size="11">同一位置 m，在不同频率上转过不同角度</text>
    <g transform="translate(68 131)"><circle r="48" fill="var(--coral-soft)" stroke="var(--coral)"/><path d="M0 0L38-23" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="var(--text)"/><text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700">快表</text><text x="0" y="88" text-anchor="middle" class="muted" font-size="10">分辨近邻</text></g>
    <g transform="translate(202 131)"><circle r="48" fill="var(--amber-soft)" stroke="var(--amber)"/><path d="M0 0L8-43" stroke="var(--amber)" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="var(--text)"/><text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700">中速表</text><text x="0" y="88" text-anchor="middle" class="muted" font-size="10">覆盖句子</text></g>
    <g transform="translate(137 260)"><circle r="48" fill="var(--teal-soft)" stroke="var(--teal)"/><path d="M0 0L42-9" stroke="var(--teal)" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="var(--text)"/><text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700">慢表</text><text x="0" y="88" text-anchor="middle" class="muted" font-size="10">感知长距离</text></g>
  </g>
</svg>
