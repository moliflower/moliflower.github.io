<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
  <title id="title">ViT 必须把展平的 patch 重新锚定到二维图像</title>
  <desc id="desc">一幅天空、山和水面的图像被切成 patch。外观相近的蓝色 patch 在上方表示天空，在下方表示水面；展平后只有位置坐标才能保留这种空间含义。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--wash)"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--blue-soft)"/><stop offset="1" stop-color="var(--panel)"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="context-stroke"/></marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c;--coral-soft:#ffedd5}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c;--coral-soft:#7c2d12}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}.muted{fill:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.stage{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.flow{fill:none;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="570" rx="28" fill="url(#paper)"/>
  <text x="44" y="49" font-size="25" font-weight="700">同样是蓝色 patch，在上面是天空，在下面可能是水</text>
  <text x="44" y="76" class="muted" font-size="14">patch embedding 能认颜色和纹理，却不会自动记住它从画面的哪一格剪下来</text>

  <g transform="translate(44 108)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="var(--blue)">① 一张有空间语义的图像</text>
    <g transform="translate(0 20)"><rect class="stage" width="300" height="300" rx="18" fill="url(#sky)"/>
      <circle cx="242" cy="55" r="24" fill="var(--amber-soft)" stroke="var(--amber)"/>
      <path d="M0 184L74 104l48 55 47-72 84 97 47-40v96H0Z" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="2"/>
      <path d="M0 220Q62 199 112 225T222 220T300 224V300H0Z" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"/>
      <g stroke="var(--border)" stroke-width="1.5"><path d="M75 0V300M150 0V300M225 0V300M0 75H300M0 150H300M0 225H300"/></g>
      <g class="scan"><rect x="1" y="1" width="73" height="73" rx="8" fill="none" stroke="var(--coral)" stroke-width="4"/><rect x="226" y="226" width="73" height="73" rx="8" fill="none" stroke="var(--coral)" stroke-width="4"/></g>
      <rect x="10" y="10" width="38" height="22" rx="7" fill="var(--panel)"/><text x="29" y="25" text-anchor="middle" class="mono" font-size="11">r1c1</text><rect x="237" y="268" width="50" height="22" rx="7" fill="var(--panel)"/><text x="262" y="283" text-anchor="middle" class="mono" font-size="11">r4c4</text>
    </g>
    <g transform="translate(0 335)"><rect width="300" height="62" rx="14" fill="var(--coral-soft)" stroke="var(--coral)"/><text x="18" y="25" font-size="13" font-weight="700" fill="var(--coral)">内容相似 ≠ 空间角色相同</text><text x="18" y="47" class="muted" font-size="12">“蓝色”只有结合行列坐标才成为天空或水面。</text></g>
  </g>

  <path class="flow" d="M363 270H415" stroke="var(--muted)"/><text x="389" y="253" text-anchor="middle" class="muted" font-size="11">按行展平</text>

  <g transform="translate(426 108)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="var(--coral)">② 进入序列后，网格消失了</text>
    <rect class="stage" y="20" width="198" height="397" rx="18"/>
    <g transform="translate(22 48)">
      <text x="0" y="0" class="muted" font-size="11">content vectors</text>
      <g transform="translate(0 18)"><rect width="154" height="38" rx="9" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="77" y="24" text-anchor="middle" font-size="12">蓝 · 平滑纹理</text></g>
      <g transform="translate(0 68)"><rect width="154" height="38" rx="9" fill="var(--amber-soft)" stroke="var(--amber)"/><text x="77" y="24" text-anchor="middle" font-size="12">亮 · 圆形边缘</text></g>
      <g transform="translate(0 118)"><rect width="154" height="38" rx="9" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="77" y="24" text-anchor="middle" font-size="12">绿 · 斜向边缘</text></g>
      <text x="77" y="190" text-anchor="middle" font-size="22" class="muted">⋮</text>
      <g transform="translate(0 214)"><rect width="154" height="38" rx="9" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="77" y="24" text-anchor="middle" font-size="12">蓝 · 平滑纹理</text></g>
      <path d="M-5 272H159" stroke="var(--coral)" stroke-width="2" stroke-dasharray="5 5"/><text x="77" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="var(--coral)">谁在上？谁在下？</text><text x="77" y="325" text-anchor="middle" class="muted" font-size="11">向量本身没有答案</text>
    </g>
  </g>

  <path class="flow" d="M644 270H696" stroke="var(--teal)"/><text x="670" y="253" text-anchor="middle" class="muted" font-size="11">加坐标</text>

  <g transform="translate(706 108)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="var(--teal)">③ 每个 token 带着返程地址</text>
    <rect class="stage" y="20" width="210" height="397" rx="18"/>
    <g transform="translate(25 46)"><rect width="160" height="74" rx="14" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="16" y="25" font-size="12">蓝色内容向量</text><text x="16" y="52" class="mono" font-size="13" font-weight="700">＋ p(r1,c1)</text></g>
    <path class="flow" d="M105 132V171" stroke="var(--teal)"/>
    <g transform="translate(25 184)"><rect width="160" height="74" rx="14" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="16" y="25" font-size="12">蓝色内容向量</text><text x="16" y="52" class="mono" font-size="13" font-weight="700">＋ p(r4,c4)</text></g>
    <g transform="translate(25 290)"><rect width="160" height="78" rx="14" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="80" y="26" text-anchor="middle" font-size="13" font-weight="700">Transformer 可以重建关系</text><text x="80" y="49" text-anchor="middle" class="mono" font-size="11">附近 / 同行 / 同列</text><text x="80" y="67" text-anchor="middle" class="muted" font-size="10">空间拓扑重新可见</text></g>
  </g>
  <text x="480" y="548" text-anchor="middle" class="muted" font-size="13">展平只改变存储形状；位置向量保存的是每个 patch 在原图中的二维来历。</text>
</svg>
