<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 96 960 436" role="img" aria-labelledby="title desc">
  <title id="title">电脑、实验室服务器和 GitHub 之间有三条彼此独立的 SSH 身份链路</title>
  <desc id="desc">电脑用私钥 A 登录实验室服务器，服务器保存公钥 A。电脑用私钥 B 访问 GitHub，GitHub 保存公钥 B。实验室服务器如需访问 GitHub，应使用自己的私钥 C，GitHub 保存公钥 C。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--wash)"/></linearGradient>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="var(--teal)"/></marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c;--coral-soft:#ffedd5}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c;--coral-soft:#7c2d12}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}.muted{fill:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.node{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.link{fill:none;stroke:var(--teal);stroke-width:4;marker-end:url(#tealArrow)}.key{stroke-width:4;fill:none}
    </style>
  </defs>
  <rect x="0" y="96" width="960" height="436" rx="28" fill="url(#paper)"/>
  <g transform="translate(52 348)"><rect class="node" width="256" height="164" rx="20"/><text x="128" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="var(--blue)">Windows 电脑</text><g transform="translate(20 53)"><rect width="101" height="84" rx="13" fill="var(--blue-soft)" stroke="var(--blue)"/><path class="key" d="M19 31a15 15 0 1 1 11 15v19H20v-9H11v-9h10v-7" stroke="var(--amber)"/><text x="69" y="28" text-anchor="middle" font-size="11" font-weight="700">私钥 A</text><text x="69" y="45" text-anchor="middle" class="muted" font-size="9">登录服务器</text><text x="69" y="65" text-anchor="middle" font-size="11" font-weight="700">私钥 B</text><text x="69" y="79" text-anchor="middle" class="muted" font-size="9">访问 GitHub</text></g><text x="147" y="83" font-size="10" class="muted">两把钥匙</text><text x="147" y="101" font-size="10" class="muted">两种权限</text><text x="147" y="119" font-size="10" class="muted">可单独撤销</text></g>
  <g transform="translate(652 348)"><rect class="node" width="256" height="164" rx="20"/><text x="128" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="var(--amber)">实验室服务器</text><g transform="translate(20 53)"><rect width="101" height="84" rx="13" fill="var(--amber-soft)" stroke="var(--amber)"/><text x="50" y="24" text-anchor="middle" font-size="11" font-weight="700">公钥 A</text><text x="50" y="42" text-anchor="middle" class="mono" font-size="8">authorized_keys</text><path d="M15 53H86" stroke="var(--border)"/><text x="50" y="72" text-anchor="middle" font-size="11" font-weight="700">私钥 C</text></g><text x="147" y="79" font-size="10" class="muted">A：接受电脑登录</text><text x="147" y="101" font-size="10" class="muted">C：服务器自己</text><text x="147" y="119" font-size="10" class="muted">访问 GitHub</text></g>
  <g transform="translate(352 116)"><rect class="node" width="256" height="164" rx="20"/><text x="128" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="var(--teal)">GitHub</text><g transform="translate(24 56)"><rect width="208" height="78" rx="13" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="16" y="25" font-size="11" font-weight="700">账户 / 仓库保存：</text><text x="16" y="48" class="mono" font-size="10">公钥 B ← 识别电脑</text><text x="16" y="66" class="mono" font-size="10">公钥 C ← 识别服务器</text></g></g>
  <path class="link" d="M318 402H636"/><g transform="translate(407 387)"><rect width="146" height="31" rx="9" fill="var(--panel)" stroke="var(--teal)"/><text x="73" y="20" text-anchor="middle" font-size="10" font-weight="700">A · 电脑 → 服务器</text></g>
  <path class="link" d="M253 336Q318 230 400 270"/><g transform="translate(236 245)"><rect width="144" height="31" rx="9" fill="var(--panel)" stroke="var(--teal)"/><text x="72" y="20" text-anchor="middle" font-size="10" font-weight="700">B · 电脑 → GitHub</text></g>
  <path class="link" d="M707 336Q642 230 560 270"/><g transform="translate(580 245)"><rect width="155" height="31" rx="9" fill="var(--panel)" stroke="var(--teal)"/><text x="77" y="20" text-anchor="middle" font-size="10" font-weight="700">C · 服务器 → GitHub</text></g>
</svg>
