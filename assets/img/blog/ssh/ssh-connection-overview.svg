<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 84 960 402" role="img" aria-labelledby="title desc">
  <title id="title">SSH 连接分为身份认证和加密会话两个阶段</title>
  <desc id="desc">第一阶段，服务器发送挑战，客户端使用留在本机的私钥签名，服务器使用已保存的公钥验证。第二阶段，认证成功后，命令和文件发往服务器，终端输出沿加密通道返回客户端。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="var(--bg)" />
      <stop offset="1" stop-color="var(--wash)" />
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="var(--blue-soft)" />
      <stop offset="0.5" stop-color="var(--teal-soft)" />
      <stop offset="1" stop-color="var(--amber-soft)" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="var(--amber)" />
    </marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}
      .muted{fill:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.lane{fill:none;stroke-width:3;stroke-linecap:round}
      @media(prefers-reduced-motion:reduce){.packet{display:none}}
    </style>
  </defs>

  <rect x="0" y="84" width="960" height="402" rx="28" fill="url(#background)" />

  <g aria-label="阶段一：身份认证">
    <rect x="40" y="100" width="880" height="172" rx="20" class="panel" />
    <rect x="58" y="116" width="132" height="28" rx="14" fill="var(--amber-soft)" />
    <text x="124" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="var(--amber)">阶段 1 · 认证一次</text>

    <g transform="translate(70 154)">
      <rect width="210" height="90" rx="14" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5" />
      <circle cx="34" cy="34" r="16" fill="var(--panel)" stroke="var(--blue)" stroke-width="2" />
      <path d="M27 34h21m-7 0v8m-7-8v8" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" />
      <text x="62" y="28" font-size="13" font-weight="700">客户端：私钥</text>
      <text x="62" y="49" class="muted" font-size="11">只在本机完成签名</text>
      <text x="20" y="73" font-size="11" font-weight="700" fill="var(--coral)">私钥不会发送给服务器</text>
    </g>

    <g transform="translate(680 154)">
      <rect width="210" height="90" rx="14" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="1.5" />
      <path d="M20 25h30v35H20zM26 25v-6a9 9 0 0 1 18 0v6" fill="var(--panel)" stroke="var(--amber)" stroke-width="2" />
      <text x="64" y="28" font-size="13" font-weight="700">服务器：公钥</text>
      <text x="64" y="49" class="muted" font-size="11">核对签名是否有效</text>
      <text x="20" y="73" font-size="11" font-weight="700" fill="var(--teal)">验证通过 → 建立会话</text>
    </g>

    <text x="480" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="var(--amber)">① 服务器发送随机挑战</text>
    <path d="M656 171H304" class="lane" stroke="var(--amber)" marker-end="url(#arrow-amber)" />
    <text x="480" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="var(--blue)">② 客户端返回签名</text>
    <path d="M304 221H656" class="lane" stroke="var(--blue)" marker-end="url(#arrow-blue)" />
  </g>

  <g aria-label="阶段二：加密会话">
    <rect x="40" y="292" width="880" height="178" rx="20" class="panel" />
    <rect x="58" y="308" width="156" height="28" rx="14" fill="var(--teal-soft)" />
    <text x="136" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="var(--teal)">阶段 2 · 会话持续</text>

    <g transform="translate(70 350)">
      <rect width="180" height="82" rx="13" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5" />
      <rect x="18" y="17" width="42" height="32" rx="4" fill="var(--panel)" stroke="var(--blue)" stroke-width="2" />
      <path d="M27 28l7 6-7 6m11 0h11" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="72" y="31" font-size="13" font-weight="700">本地终端</text>
      <text x="72" y="52" class="muted" font-size="11">输入与查看结果</text>
      <text x="90" y="70" text-anchor="middle" class="mono" font-size="10">ssh client</text>
    </g>

    <g transform="translate(710 350)">
      <rect width="180" height="82" rx="13" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="1.5" />
      <g fill="var(--panel)" stroke="var(--amber)" stroke-width="1.5">
        <rect x="18" y="14" width="42" height="15" rx="3" />
        <rect x="18" y="34" width="42" height="15" rx="3" />
      </g>
      <text x="72" y="31" font-size="13" font-weight="700">远程服务器</text>
      <text x="72" y="52" class="muted" font-size="11">执行与返回结果</text>
      <text x="90" y="70" text-anchor="middle" class="mono" font-size="10">sshd</text>
    </g>

    <rect x="274" y="343" width="412" height="98" rx="49" fill="url(#tunnel)" stroke="var(--teal)" stroke-width="1.5" />
    <text x="480" y="361" text-anchor="middle" font-size="10" font-weight="700" fill="var(--blue)">命令 / 文件</text>
    <path d="M296 375H664" class="lane" stroke="var(--blue)" marker-end="url(#arrow-blue)" />
    <text x="480" y="405" text-anchor="middle" font-size="10" font-weight="700" fill="var(--teal)">终端输出</text>
    <path d="M664 419H296" class="lane" stroke="var(--teal)" marker-end="url(#arrow-teal)" />

    <circle class="packet" r="6" fill="var(--blue)">
      <animateMotion path="M296 375H656" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle class="packet" r="6" fill="var(--teal)">
      <animateMotion path="M664 419H304" dur="3s" begin="0.65s" repeatCount="indefinite" />
    </circle>
  </g>

</svg>
