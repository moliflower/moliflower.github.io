<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">FFN 逐个展开 token 的特征通道而不改变 token 数量</title>
  <desc id="desc">三个 token 始终保持三行。每行先从四个 d_model 通道展开为十二个 d_ff 特征探测器，非线性选择部分响应，再压缩回四个通道。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--wash)"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="context-stroke"/></marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c;--coral-soft:#ffedd5}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c;--coral-soft:#7c2d12}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}.muted{fill:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.stage{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.flow{fill:none;stroke-width:3;marker-end:url(#arrow)}.cell{stroke-width:1.5}
    </style>
  </defs>
  <rect width="960" height="560" rx="28" fill="url(#paper)"/>
  <text x="44" y="49" font-size="25" font-weight="700">FFN 不是把 token 变多，而是把每个 token 的“工作台”铺宽</text>
  <text x="44" y="76" class="muted" font-size="14">B 和 S 始终不动；变化只发生在最后一维</text>

  <g transform="translate(44 111)">
    <rect class="stage" width="170" height="326" rx="20"/><text x="85" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="var(--blue)">输入 · d_model = 4</text>
    <g transform="translate(25 60)"><text x="-8" y="23" text-anchor="end" class="mono" font-size="11">t₁</text><g fill="var(--blue-soft)" stroke="var(--blue)"><rect class="cell" x="0" width="24" height="38" rx="6"/><rect class="cell" x="30" width="24" height="38" rx="6"/><rect class="cell" x="60" width="24" height="38" rx="6"/><rect class="cell" x="90" width="24" height="38" rx="6"/></g>
      <text x="-8" y="99" text-anchor="end" class="mono" font-size="11">t₂</text><g transform="translate(0 76)" fill="var(--blue-soft)" stroke="var(--blue)"><rect class="cell" x="0" width="24" height="38" rx="6"/><rect class="cell" x="30" width="24" height="38" rx="6"/><rect class="cell" x="60" width="24" height="38" rx="6"/><rect class="cell" x="90" width="24" height="38" rx="6"/></g>
      <text x="-8" y="175" text-anchor="end" class="mono" font-size="11">t₃</text><g transform="translate(0 152)" fill="var(--blue-soft)" stroke="var(--blue)"><rect class="cell" x="0" width="24" height="38" rx="6"/><rect class="cell" x="30" width="24" height="38" rx="6"/><rect class="cell" x="60" width="24" height="38" rx="6"/><rect class="cell" x="90" width="24" height="38" rx="6"/></g>
    </g><path d="M24 278H146" stroke="var(--border)"/><text x="85" y="303" text-anchor="middle" class="mono" font-size="12">[B, 3, 4]</text>
  </g>
  <path class="flow" d="M224 275H300" stroke="var(--amber)"/><text x="262" y="256" text-anchor="middle" class="mono" font-size="12">W_up</text>

  <g transform="translate(310 96)">
    <rect class="stage" width="344" height="356" rx="20"/><text x="172" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="var(--amber)">中间层 · d_ff = 12</text><text x="172" y="54" text-anchor="middle" class="muted" font-size="11">每一列像一个不同的特征探测器</text>
    <g transform="translate(18 76)"><text x="-4" y="23" text-anchor="end" class="mono" font-size="11">t₁</text><g transform="translate(8)"><rect width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect x="26" width="22" height="38" rx="5" fill="var(--amber-soft)" stroke="var(--amber)"/><rect x="52" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect class="active" x="78" width="22" height="38" rx="5" fill="var(--coral-soft)" stroke="var(--coral)"/><rect x="104" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect class="active" x="130" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect x="156" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="182" width="22" height="38" rx="5" fill="var(--amber-soft)" stroke="var(--amber)"/><rect x="208" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect class="active" x="234" width="22" height="38" rx="5" fill="var(--coral-soft)" stroke="var(--coral)"/><rect x="260" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="286" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/></g>
      <text x="-4" y="99" text-anchor="end" class="mono" font-size="11">t₂</text><use href="#row2"/><g id="row2" transform="translate(8 76)"><rect width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="26" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect x="52" width="22" height="38" rx="5" fill="var(--amber-soft)" stroke="var(--amber)"/><rect x="78" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect class="active" x="104" width="22" height="38" rx="5" fill="var(--coral-soft)" stroke="var(--coral)"/><rect x="130" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="156" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect class="active" x="182" width="22" height="38" rx="5" fill="var(--amber-soft)" stroke="var(--amber)"/><rect x="208" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="234" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect class="active" x="260" width="22" height="38" rx="5" fill="var(--coral-soft)" stroke="var(--coral)"/><rect x="286" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/></g>
      <text x="-4" y="175" text-anchor="end" class="mono" font-size="11">t₃</text><g transform="translate(8 152)"><rect class="active" width="22" height="38" rx="5" fill="var(--coral-soft)" stroke="var(--coral)"/><rect x="26" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="52" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect x="78" width="22" height="38" rx="5" fill="var(--amber-soft)" stroke="var(--amber)"/><rect x="104" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect class="active" x="130" width="22" height="38" rx="5" fill="var(--coral-soft)" stroke="var(--coral)"/><rect x="156" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="182" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect class="active" x="208" width="22" height="38" rx="5" fill="var(--amber-soft)" stroke="var(--amber)"/><rect x="234" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/><rect x="260" width="22" height="38" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"/><rect x="286" width="22" height="38" rx="5" fill="var(--panel)" stroke="var(--border)"/></g>
    </g><path d="M20 292H324" stroke="var(--border)"/><text x="172" y="317" text-anchor="middle" class="mono" font-size="12">[B, 3, 12]</text><text x="172" y="340" text-anchor="middle" class="muted" font-size="11">非线性让不同 token 点亮不同特征</text>
  </g>
  <path class="flow" d="M664 275H740" stroke="var(--teal)"/><text x="702" y="256" text-anchor="middle" class="mono" font-size="12">W_down</text>
  <g transform="translate(750 111)"><rect class="stage" width="166" height="326" rx="20"/><text x="83" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="var(--teal)">输出 · d_model = 4</text>
    <g transform="translate(24 60)"><g fill="var(--teal-soft)" stroke="var(--teal)"><rect width="24" height="38" rx="6"/><rect x="30" width="24" height="38" rx="6"/><rect x="60" width="24" height="38" rx="6"/><rect x="90" width="24" height="38" rx="6"/><rect y="76" width="24" height="38" rx="6"/><rect x="30" y="76" width="24" height="38" rx="6"/><rect x="60" y="76" width="24" height="38" rx="6"/><rect x="90" y="76" width="24" height="38" rx="6"/><rect y="152" width="24" height="38" rx="6"/><rect x="30" y="152" width="24" height="38" rx="6"/><rect x="60" y="152" width="24" height="38" rx="6"/><rect x="90" y="152" width="24" height="38" rx="6"/></g></g>
    <path d="M22 278H144" stroke="var(--border)"/><text x="83" y="303" text-anchor="middle" class="mono" font-size="12">[B, 3, 4]</text>
  </g>
  <g transform="translate(44 474)"><path d="M0 0H872" stroke="var(--border)"/><text x="436" y="29" text-anchor="middle" font-size="13"><tspan font-weight="700" fill="var(--teal)">3 个 token 从头到尾没有增减。</tspan><tspan class="muted"> 只是每个 token 暂时拥有更多可响应的特征方向。</tspan></text></g>
</svg>
