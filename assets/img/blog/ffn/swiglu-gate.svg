<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU 用连续门控值逐通道调制候选特征</title>
  <desc id="desc">输入经过 up projection 得到候选特征 u，经过 gate projection 和 SiLU 得到门控值 g。每个通道计算 h_i 等于 g_i 乘 u_i。门控值接近零时抑制候选，接近一时保留，大于一时放大，为负时可反转方向。最后 down projection 混合所有结果并写回模型维度。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="var(--bg)" />
      <stop offset="1" stop-color="var(--wash)" />
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="context-stroke" />
    </marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c;--coral-soft:#ffedd5}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c;--coral-soft:#7c2d12}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}
      .muted{fill:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.flow{fill:none;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.cell{stroke-width:1.5}
    </style>
  </defs>

  <rect width="960" height="440" rx="28" fill="url(#paper)" />

  <g aria-label="输入 X" transform="translate(35 169)">
    <rect width="112" height="86" rx="17" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5" />
    <text x="56" y="35" text-anchor="middle" font-size="15" font-weight="700">输入 X</text>
    <text x="56" y="59" text-anchor="middle" class="mono muted" font-size="11">d_model</text>
  </g>
  <path d="M147 190C160 190 158 132 170 132" class="flow" stroke="var(--blue)" />
  <path d="M147 226C160 226 158 204 170 204" class="flow" stroke="var(--amber)" />

  <g aria-label="逐通道门控计算" transform="translate(170 20)">
    <rect width="620" height="400" rx="21" class="panel" />
    <text x="24" y="31" font-size="14" font-weight="700">同一组中间通道，逐列计算 hᵢ = gᵢ × uᵢ</text>
    <text x="24" y="53" class="muted" font-size="11">gᵢ 来自 SiLU，不是概率，也不被限制在 0 到 1</text>

    <g class="mono muted" font-size="10" text-anchor="middle">
      <text x="172" y="82">1</text><text x="244" y="82">2</text><text x="316" y="82">3</text>
      <text x="388" y="82">4</text><text x="460" y="82">5</text><text x="532" y="82">6</text>
    </g>

    <text x="24" y="120" font-size="12" font-weight="700" fill="var(--blue)">候选 uᵢ</text>
    <text x="24" y="138" class="mono muted" font-size="10">up_proj(x)</text>
    <g transform="translate(140 92)" fill="var(--blue-soft)" stroke="var(--blue)">
      <rect class="cell" width="64" height="52" rx="10" /><rect class="cell" x="72" width="64" height="52" rx="10" />
      <rect class="cell" x="144" width="64" height="52" rx="10" /><rect class="cell" x="216" width="64" height="52" rx="10" />
      <rect class="cell" x="288" width="64" height="52" rx="10" /><rect class="cell" x="360" width="64" height="52" rx="10" />
      <g fill="var(--text)" stroke="none" text-anchor="middle" class="mono" font-size="12">
        <text x="32" y="32">1.20</text><text x="104" y="32">−0.80</text><text x="176" y="32">0.50</text>
        <text x="248" y="32">1.10</text><text x="320" y="32">−1.40</text><text x="392" y="32">0.70</text>
      </g>
    </g>

    <text x="24" y="192" font-size="12" font-weight="700" fill="var(--amber)">门控 gᵢ</text>
    <text x="24" y="210" class="mono muted" font-size="10">SiLU(gate_proj(x))</text>
    <g transform="translate(140 164)">
      <rect class="cell" width="64" height="52" rx="10" fill="var(--coral-soft)" stroke="var(--coral)" />
      <rect class="cell" x="72" width="64" height="52" rx="10" fill="var(--panel)" stroke="var(--border)" />
      <rect class="cell" x="144" width="64" height="52" rx="10" fill="var(--panel)" stroke="var(--border)" />
      <rect class="cell" x="216" width="64" height="52" rx="10" fill="var(--teal-soft)" stroke="var(--teal)" />
      <rect class="cell" x="288" width="64" height="52" rx="10" fill="var(--amber-soft)" stroke="var(--amber)" />
      <rect class="cell" x="360" width="64" height="52" rx="10" fill="var(--blue-soft)" stroke="var(--blue)" />
      <g fill="var(--text)" text-anchor="middle" class="mono" font-size="12">
        <text x="32" y="32">0.05</text><text x="104" y="32">0.90</text><text x="176" y="32">0.00</text>
        <text x="248" y="32">1.00</text><text x="320" y="32">1.30</text><text x="392" y="32">−0.20</text>
      </g>
    </g>

    <path d="M140 238H564" stroke="var(--border)" />
    <text x="352" y="258" text-anchor="middle" class="muted" font-size="11">↓　逐通道相乘　↓</text>

    <text x="24" y="294" font-size="12" font-weight="700" fill="var(--teal)">结果 hᵢ</text>
    <text x="24" y="312" class="mono muted" font-size="10">gᵢ × uᵢ</text>
    <g transform="translate(140 266)">
      <rect class="cell" width="64" height="52" rx="10" fill="var(--coral-soft)" stroke="var(--coral)" />
      <rect class="cell" x="72" width="64" height="52" rx="10" fill="var(--teal-soft)" stroke="var(--teal)" />
      <rect class="cell" x="144" width="64" height="52" rx="10" fill="var(--coral-soft)" stroke="var(--coral)" />
      <rect class="cell" x="216" width="64" height="52" rx="10" fill="var(--teal-soft)" stroke="var(--teal)" />
      <rect class="cell" x="288" width="64" height="52" rx="10" fill="var(--amber-soft)" stroke="var(--amber)" />
      <rect class="cell" x="360" width="64" height="52" rx="10" fill="var(--blue-soft)" stroke="var(--blue)" />
      <g fill="var(--text)" text-anchor="middle" class="mono" font-size="12">
        <text x="32" y="32">0.06</text><text x="104" y="32">−0.72</text><text x="176" y="32">0.00</text>
        <text x="248" y="32">1.10</text><text x="320" y="32">−1.82</text><text x="392" y="32">−0.14</text>
      </g>
    </g>

    <g transform="translate(24 346)" font-size="10" text-anchor="middle">
      <rect width="132" height="32" rx="9" fill="var(--coral-soft)" /><text x="66" y="21">g≈0　抑制</text>
      <rect x="144" width="132" height="32" rx="9" fill="var(--teal-soft)" /><text x="210" y="21">g≈1　保留</text>
      <rect x="288" width="132" height="32" rx="9" fill="var(--amber-soft)" /><text x="354" y="21">g&gt;1　放大</text>
      <rect x="432" width="132" height="32" rx="9" fill="var(--blue-soft)" /><text x="498" y="21">g&lt;0　反向</text>
    </g>
  </g>

  <path d="M790 302H812" class="flow" stroke="var(--teal)" />
  <g aria-label="down projection 混合结果" transform="translate(816 257)">
    <rect width="110" height="90" rx="17" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.5" />
    <text x="55" y="29" text-anchor="middle" class="mono" font-size="11" font-weight="700">down_proj</text>
    <text x="55" y="51" text-anchor="middle" font-size="11">混合全部 hᵢ</text>
    <text x="55" y="72" text-anchor="middle" class="mono muted" font-size="10">→ d_model</text>
  </g>
</svg>
