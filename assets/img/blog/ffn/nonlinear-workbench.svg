<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
  <title id="title">非线性把原空间中纠缠的样本抬到更容易分开的特征空间</title>
  <desc id="desc">蓝色和橙色样本在二维平面呈对角交错，任何直线都无法完全分开。升维并加入非线性后，橙色样本被抬高，一张平面即可把两类分开；连续线性层则只能旋转和拉伸原平面。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--wash)"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="context-stroke"/></marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c;--coral-soft:#ffedd5}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c;--coral-soft:#7c2d12}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}.muted{fill:var(--muted)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.stage{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.axis{fill:none;stroke:var(--border);stroke-width:1.5}.flow{fill:none;stroke-width:3;marker-end:url(#arrow)}.lift{animation:rise 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes rise{from{transform:translateY(22px)}to{transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.lift{animation:none}}
    </style>
  </defs>
  <rect width="960" height="570" rx="28" fill="url(#paper)"/>
  <text x="44" y="49" font-size="25" font-weight="700">非线性真正做的事：把纠缠关系“抬起来”再处理</text>
  <text x="44" y="76" class="muted" font-size="14">宽度提供更多方向，激活函数让不同区域走上不同高度</text>

  <g transform="translate(44 112)">
    <rect class="stage" width="264" height="354" rx="20"/><text x="20" y="32" font-size="14" font-weight="700" fill="var(--coral)">原空间：两类对角交错</text>
    <g transform="translate(38 68)"><rect width="188" height="188" rx="12" fill="var(--blue-soft)" opacity=".18"/><path class="axis" d="M0 188V0M0 188H188"/>
      <g fill="var(--blue)" stroke="var(--panel)" stroke-width="3"><circle cx="38" cy="42" r="13"/><circle cx="150" cy="145" r="13"/></g><g fill="var(--amber)" stroke="var(--panel)" stroke-width="3"><circle cx="145" cy="40" r="13"/><circle cx="42" cy="148" r="13"/></g>
      <path d="M15 168L171 18" stroke="var(--coral)" stroke-width="3" stroke-dasharray="8 6"/><path d="M18 105L176 83" stroke="var(--coral)" stroke-width="3" stroke-dasharray="8 6"/><text x="94" y="213" text-anchor="middle" class="muted" font-size="11">换任何一条直线，都会切错样本</text>
    </g>
    <g transform="translate(20 305)"><rect width="224" height="31" rx="9" fill="var(--coral-soft)"/><text x="112" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="var(--coral)">单个线性边界无法解决 XOR 关系</text></g>
  </g>

  <g transform="translate(328 182)">
    <path class="flow" d="M0 64H96" stroke="var(--muted)"/><text x="48" y="47" text-anchor="middle" class="mono" font-size="12">W_up</text><path class="flow" d="M0 112H96" stroke="var(--teal)"/><text x="48" y="137" text-anchor="middle" font-size="11" fill="var(--teal)">＋ GELU / SiLU</text>
  </g>

  <g transform="translate(434 96)">
    <rect class="stage" width="482" height="382" rx="20"/><text x="22" y="34" font-size="14" font-weight="700" fill="var(--teal)">更宽的非线性空间：增加一个“组合特征”轴</text>
    <text x="22" y="57" class="muted" font-size="11">示意：新维度对 x₁ 与 x₂ 的组合产生不同响应</text>
    <g transform="translate(42 90)">
      <path class="axis" d="M45 220L350 220M45 220L0 250M45 220V18"/><text x="358" y="224" class="mono" font-size="11">x₁</text><text x="0" y="266" class="mono" font-size="11">x₂</text><text x="28" y="15" class="mono" font-size="11">φ(x)</text>
      <path d="M35 139L350 139 399 105 83 105Z" fill="var(--teal-soft)" opacity=".55" stroke="var(--teal)" stroke-width="2"/><text x="363" y="126" font-size="11" fill="var(--teal)">一张分隔平面</text>
      <g fill="var(--blue)" stroke="var(--panel)" stroke-width="3"><circle cx="98" cy="196" r="13"/><circle cx="292" cy="189" r="13"/></g>
      <g class="lift" fill="var(--amber)" stroke="var(--panel)" stroke-width="3"><circle cx="252" cy="68" r="13"/><circle cx="148" cy="74" r="13"/></g>
      <g stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 5"><path d="M252 68V190"/><path d="M148 74V193"/></g>
      <text x="205" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="var(--amber)">非线性把橙色样本抬到另一侧</text>
    </g>
    <g transform="translate(24 329)"><rect width="434" height="34" rx="10" fill="var(--teal-soft)"/><text x="217" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="var(--teal)">在新空间里，一个简单平面就能完成区分</text></g>
  </g>
  <g transform="translate(44 505)"><rect width="872" height="39" rx="12" fill="var(--panel)" stroke="var(--border)"/><text x="436" y="25" text-anchor="middle" font-size="12"><tspan font-weight="700">没有激活：</tspan><tspan class="mono"> W₂(W₁X) = (W₂W₁)X</tspan><tspan class="muted">，再多线性层也只是旋转、拉伸与投影。</tspan></text></g>
</svg>
