<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">单个 FPN 融合单元</title>
  <desc id="desc">更深层的中间特征经过两倍上采样，当前骨干特征经过一乘一卷积，两者形状对齐后逐元素相加，再经三乘三卷积得到当前层金字塔输出。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--wash)"/></linearGradient>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--teal)"/></marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--amber)"/></marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}.muted{fill:var(--muted)}.on-accent{fill:var(--panel)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.flow[stroke="var(--teal)"]{marker-end:url(#arrow-teal)}.flow[stroke="var(--amber)"]{marker-end:url(#arrow-amber)}
    </style>
  </defs>

  <rect width="960" height="330" rx="28" fill="url(#bg)"/>

  <g transform="translate(48 42)">
    <rect width="230" height="74" rx="13" fill="var(--teal-soft)" stroke="var(--teal)"/>
    <text x="18" y="30" font-size="14" font-weight="700">更深层中间特征 M<tspan baseline-shift="sub" font-size="10">i+1</tspan></text>
    <text x="18" y="54" class="mono muted" font-size="11">[B, 256, H/2, W/2]</text>
  </g>

  <g transform="translate(48 214)">
    <rect width="230" height="74" rx="13" fill="var(--blue-soft)" stroke="var(--blue)"/>
    <text x="18" y="30" font-size="14" font-weight="700">当前骨干特征 C<tspan baseline-shift="sub" font-size="10">i</tspan></text>
    <text x="18" y="54" class="mono muted" font-size="11">[B, C<tspan baseline-shift="sub" font-size="9">i</tspan>, H, W]</text>
  </g>

  <g transform="translate(342 57)">
    <rect width="144" height="48" rx="10" fill="var(--panel)" stroke="var(--teal)"/>
    <text x="72" y="22" text-anchor="middle" font-size="13" font-weight="700">2× 上采样</text>
    <text x="72" y="39" text-anchor="middle" class="muted" font-size="11">只对齐空间尺寸</text>
  </g>

  <g transform="translate(342 229)">
    <rect width="144" height="48" rx="10" fill="var(--panel)" stroke="var(--amber)"/>
    <text x="72" y="22" text-anchor="middle" font-size="13" font-weight="700">1×1 卷积</text>
    <text x="72" y="39" text-anchor="middle" class="muted" font-size="11">投影到 256 通道</text>
  </g>

  <path d="M278 79H334" class="flow" stroke="var(--teal)"/>
  <path d="M278 251H334" class="flow" stroke="var(--amber)"/>
  <path d="M486 81H512Q534 81 546 108L558 136" class="flow" stroke="var(--teal)"/>
  <path d="M486 253H512Q534 253 546 226L558 194" class="flow" stroke="var(--amber)"/>

  <circle cx="570" cy="165" r="31" fill="var(--teal)" stroke="var(--panel)" stroke-width="3"/>
  <text x="570" y="174" text-anchor="middle" class="on-accent" font-size="28" font-weight="700">+</text>

  <path d="M604 165H638" class="flow" stroke="var(--teal)"/>
  <g transform="translate(646 141)">
    <rect width="126" height="48" rx="10" fill="var(--panel)" stroke="var(--teal)"/>
    <text x="63" y="22" text-anchor="middle" font-size="13" font-weight="700">3×3 卷积</text>
    <text x="63" y="39" text-anchor="middle" class="muted" font-size="11">局部整理与平滑</text>
  </g>

  <path d="M772 165H810" class="flow" stroke="var(--teal)"/>
  <g transform="translate(818 128)">
    <rect width="96" height="74" rx="13" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="2"/>
    <text x="48" y="31" text-anchor="middle" font-size="16" font-weight="700">P<tspan baseline-shift="sub" font-size="11">i</tspan></text>
    <text x="48" y="53" text-anchor="middle" class="mono muted" font-size="11">256 × H × W</text>
  </g>
</svg>
