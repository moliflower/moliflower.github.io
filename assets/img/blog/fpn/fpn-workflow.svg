<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">经典 FPN 的完整特征流</title>
  <desc id="desc">骨干网络产生 C2 到 C5，横向一乘一卷积统一通道。深层特征逐级两倍上采样并与同尺度横向特征相加，再经过三乘三卷积得到 P2 到 P5。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--wash)"/></linearGradient>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--teal)"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--blue)"/></marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--amber)"/></marker>
    <style>
      :root{--bg:#f4f8f7;--wash:#e8f3f0;--panel:#fff;--text:#142321;--muted:#60706d;--border:#b9cbc7;--teal:#0f766e;--teal-soft:#ccfbf1;--blue:#0369a1;--blue-soft:#e0f2fe;--amber:#b45309;--amber-soft:#fef3c7;--coral:#c2410c;--coral-soft:#ffedd5}
      @media(prefers-color-scheme:dark){:root{--bg:#101a1a;--wash:#132624;--panel:#182525;--text:#ecf7f5;--muted:#a7bbb7;--border:#45615c;--teal:#5eead4;--teal-soft:#134e4a;--blue:#7dd3fc;--blue-soft:#0c4a6e;--amber:#fbbf24;--amber-soft:#78350f;--coral:#fb923c;--coral-soft:#7c2d12}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--text)}.panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.muted{fill:var(--muted)}.on-accent text{fill:var(--panel)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.flow{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.flow[stroke="var(--teal)"]{marker-end:url(#arrow-teal)}.flow[stroke="var(--blue)"]{marker-end:url(#arrow-blue)}.flow[stroke="var(--amber)"]{marker-end:url(#arrow-amber)}
    </style>
  </defs>

  <rect width="960" height="500" rx="28" fill="url(#bg)"/>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="100" y="35">Backbone 输出</text>
    <text x="292" y="35">横向投影</text>
    <text x="460" y="35">Top-down 融合</text>
    <text x="635" y="35">金字塔输出</text>
    <text x="842" y="35">任务分工</text>
  </g>

  <g>
    <g transform="translate(35 72)"><rect class="panel" width="130" height="62" rx="11"/><text x="18" y="27" font-size="14" font-weight="700">C2</text><text x="18" y="47" class="mono muted" font-size="11">stride 4</text><rect x="91" y="13" width="27" height="36" rx="5" fill="var(--blue-soft)" stroke="var(--blue)"/></g>
    <g transform="translate(35 172)"><rect class="panel" width="130" height="62" rx="11"/><text x="18" y="27" font-size="14" font-weight="700">C3</text><text x="18" y="47" class="mono muted" font-size="11">stride 8</text><rect x="94" y="16" width="24" height="30" rx="5" fill="var(--blue-soft)" stroke="var(--blue)"/></g>
    <g transform="translate(35 272)"><rect class="panel" width="130" height="62" rx="11"/><text x="18" y="27" font-size="14" font-weight="700">C4</text><text x="18" y="47" class="mono muted" font-size="11">stride 16</text><rect x="98" y="20" width="20" height="23" rx="4" fill="var(--amber-soft)" stroke="var(--amber)"/></g>
    <g transform="translate(35 372)"><rect class="panel" width="130" height="62" rx="11"/><text x="18" y="27" font-size="14" font-weight="700">C5</text><text x="18" y="47" class="mono muted" font-size="11">stride 32</text><rect x="102" y="23" width="16" height="17" rx="4" fill="var(--teal-soft)" stroke="var(--teal)"/></g>
    <path d="M100 140V163M100 240V263M100 340V363" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <g fill="var(--amber-soft)" stroke="var(--amber)">
    <rect x="225" y="85" width="134" height="36" rx="9"/><rect x="225" y="185" width="134" height="36" rx="9"/><rect x="225" y="285" width="134" height="36" rx="9"/><rect x="225" y="385" width="134" height="36" rx="9"/>
  </g>
  <g text-anchor="middle" class="mono" font-size="11">
    <text x="292" y="108">1×1 → 256 ch</text><text x="292" y="208">1×1 → 256 ch</text><text x="292" y="308">1×1 → 256 ch</text><text x="292" y="408">1×1 → 256 ch</text>
  </g>
  <g class="flow" stroke="var(--amber)"><path d="M165 103H217"/><path d="M165 203H217"/><path d="M165 303H217"/><path d="M165 403H217"/></g>

  <g stroke="var(--amber)" stroke-width="2.4"><path d="M359 103H439"/><path d="M359 203H439"/><path d="M359 303H439"/><path d="M359 403H439"/></g>
  <g fill="var(--teal)" stroke="var(--panel)" stroke-width="2"><circle cx="460" cy="103" r="17"/><circle cx="460" cy="203" r="17"/><circle cx="460" cy="303" r="17"/><circle cx="460" cy="403" r="17"/></g>
  <g class="on-accent" text-anchor="middle" font-size="18" font-weight="700"><text x="460" y="109">+</text><text x="460" y="209">+</text><text x="460" y="309">+</text><text x="460" y="409">+</text></g>
  <g class="flow" stroke="var(--teal)"><path d="M460 382V326"/><path d="M460 282V226"/><path d="M460 182V126"/></g>
  <g class="muted" font-size="11"><text x="473" y="355">2× 上采样</text><text x="473" y="255">2× 上采样</text><text x="473" y="155">2× 上采样</text></g>

  <g class="flow" stroke="var(--teal)"><path d="M481 103H552"/><path d="M481 203H552"/><path d="M481 303H552"/><path d="M481 403H552"/></g>
  <g>
    <g transform="translate(560 72)"><rect width="150" height="62" rx="11" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="18" y="27" font-size="14" font-weight="700">P2</text><text x="18" y="47" class="mono muted" font-size="11">256 ch · stride 4</text></g>
    <g transform="translate(560 172)"><rect width="150" height="62" rx="11" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="18" y="27" font-size="14" font-weight="700">P3</text><text x="18" y="47" class="mono muted" font-size="11">256 ch · stride 8</text></g>
    <g transform="translate(560 272)"><rect width="150" height="62" rx="11" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="18" y="27" font-size="14" font-weight="700">P4</text><text x="18" y="47" class="mono muted" font-size="11">256 ch · stride 16</text></g>
    <g transform="translate(560 372)"><rect width="150" height="62" rx="11" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="18" y="27" font-size="14" font-weight="700">P5</text><text x="18" y="47" class="mono muted" font-size="11">256 ch · stride 32</text></g>
  </g>

  <g transform="translate(750 62)">
    <rect class="panel" width="178" height="382" rx="17"/>
    <g transform="translate(18 25)">
      <rect x="0" y="0" width="142" height="72" rx="10" fill="var(--coral-soft)" stroke="var(--coral)"/>
      <rect x="14" y="14" width="30" height="30" fill="none" stroke="var(--coral)" stroke-width="3"/>
      <text x="57" y="31" font-size="12" font-weight="700">小目标</text><text x="57" y="51" class="muted" font-size="11">优先读 P2 / P3</text>
      <rect x="0" y="103" width="142" height="72" rx="10" fill="var(--amber-soft)" stroke="var(--amber)"/>
      <rect x="14" y="117" width="43" height="43" fill="none" stroke="var(--amber)" stroke-width="3"/>
      <text x="68" y="134" font-size="12" font-weight="700">中目标</text><text x="68" y="154" class="muted" font-size="11">优先读 P3 / P4</text>
      <rect x="0" y="206" width="142" height="116" rx="10" fill="var(--teal-soft)" stroke="var(--teal)"/>
      <rect x="14" y="221" width="68" height="68" fill="none" stroke="var(--teal)" stroke-width="3"/>
      <text x="94" y="244" font-size="12" font-weight="700">大目标</text><text x="94" y="264" class="muted" font-size="11">P4 / P5</text>
      <text x="71" y="309" text-anchor="middle" class="muted" font-size="11">各层可共享同一预测头</text>
    </g>
  </g>
</svg>
