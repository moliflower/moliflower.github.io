<svg xmlns="http://www.w3.org/2000/svg" width="600" height="770" viewBox="0 0 600 770" role="img" aria-labelledby="title desc"><title id="title">一轮预算分配</title><desc id="desc">预算4先给B一个decode，再给A两个prefill，最后给C一个prefill，余量依次3、1、0。</desc><rect width="600" height="770" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="28" y="44" font-size="24" fill="#172b4d" text-anchor="start">先 Decode，再用剩余预算做 Prefill</text><text x="28" y="83" font-size="20" fill="#172b4d" text-anchor="start">输入：A:(5,3)、B:(0,2)、C:(2,1)</text><text x="28" y="115" font-size="20" fill="#172b4d" text-anchor="start">状态 = (剩余 prompt，剩余输出)</text><rect x="26" y="143" width="548" height="66" rx="12" fill="#edf2f7"/><text x="48" y="183" font-size="22" fill="#172b4d" text-anchor="start">预算 B = 4；chunk 上限 K = 2；R = 4</text><rect x="26" y="237" width="548" height="92" rx="12" fill="#c9ecdf"/><text x="46" y="272" font-size="22" fill="#172b4d" text-anchor="start">1  B 已完成 prompt：Decode 1</text><text x="46" y="308" font-size="22" fill="#172b4d" text-anchor="start">R = 4 − 1 = 3</text><rect x="26" y="357" width="548" height="92" rx="12" fill="#d9e9ff"/><text x="46" y="392" font-size="22" fill="#172b4d" text-anchor="start">2  A：min(5, 2, 3) = 2</text><text x="46" y="428" font-size="22" fill="#172b4d" text-anchor="start">R = 3 − 2 = 1</text><rect x="26" y="477" width="548" height="92" rx="12" fill="#d9e9ff"/><text x="46" y="512" font-size="22" fill="#172b4d" text-anchor="start">3  C：min(2, 2, 1) = 1</text><text x="46" y="548" font-size="22" fill="#172b4d" text-anchor="start">R = 1 − 1 = 0</text><path d="M 300 209 L 300 237" stroke="#47647b" stroke-width="3" fill="none"/><path d="M 300 329 L 300 357" stroke="#47647b" stroke-width="3" fill="none"/><path d="M 300 449 L 300 477" stroke="#47647b" stroke-width="3" fill="none"/><text x="30" y="615" font-size="23" fill="#172b4d" text-anchor="start">计划：B D1 → A P2 → C P1</text><text x="30" y="655" font-size="22" fill="#172b4d" text-anchor="start">总分配 1 + 2 + 1 = 4，没有超预算。</text><text x="30" y="699" font-size="20" fill="#172b4d" text-anchor="start">注意：C 还剩 1 个 prompt，尚无首输出。</text><text x="30" y="739" font-size="20" fill="#172b4d" text-anchor="start">本图只决策；计数变化在轮末统一提交。</text></g></svg>
