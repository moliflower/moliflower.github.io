<svg xmlns="http://www.w3.org/2000/svg" width="600" height="814" viewBox="0 0 600 814" role="img" aria-labelledby="title desc"><title id="title">Attention shape流程</title><desc id="desc">Q乘K转置产生sq乘sk分数；缩放mask和按行softmax产生P；P乘V得到sq乘dv输出。</desc><rect width="600" height="814" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="28" y="45" font-size="24" fill="#17324d" text-anchor="start">先看 Shape，再写 Attention</text><text x="28" y="82" font-size="20" fill="#17324d" text-anchor="start">sq：query数；sk：key数；d：点积宽度</text><rect x="26" y="112" width="548" height="96" rx="12" fill="#e1edff"/><text x="46" y="148" font-size="22" fill="#17324d" text-anchor="start">1  点积：Q @ Kᵀ</text><text x="46" y="186" font-size="20" fill="#17324d" text-anchor="start">(sq × d) @ (d × sk) → (sq × sk)</text><path d="M 300 208 L 300 238" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="238" width="548" height="96" rx="12" fill="#fff0d5"/><text x="46" y="274" font-size="22" fill="#17324d" text-anchor="start">2  缩放并 Mask：S</text><text x="46" y="312" font-size="20" fill="#17324d" text-anchor="start">每项除 √d；未来位置设为 −∞</text><path d="M 300 334 L 300 364" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="364" width="548" height="96" rx="12" fill="#ddf3e9"/><text x="46" y="400" font-size="22" fill="#17324d" text-anchor="start">3  每行单独 Softmax：P</text><text x="46" y="438" font-size="20" fill="#17324d" text-anchor="start">shape 仍为 sq × sk；每行概率和为 1</text><path d="M 300 460 L 300 490" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="490" width="548" height="96" rx="12" fill="#e1edff"/><text x="46" y="526" font-size="22" fill="#17324d" text-anchor="start">4  加权求和：P @ V</text><text x="46" y="564" font-size="20" fill="#17324d" text-anchor="start">(sq × sk) @ (sk × dv) → (sq × dv)</text><text x="30" y="634" font-size="20" fill="#17324d" text-anchor="start">P 的列对应 token 位置，不是特征维度。</text><text x="30" y="674" font-size="20" fill="#17324d" text-anchor="start">一般 dv 可不同于 d；Lab2 明确限制 dv=d。</text><rect x="26" y="706" width="548" height="80" rx="12" fill="#edf2f7"/><text x="46" y="739" font-size="21" fill="#17324d" text-anchor="start">手算检查：Q 3×1，K/V 3×1</text><text x="46" y="769" font-size="21" fill="#17324d" text-anchor="start">S/P 3×3，O 3×1；不要把 P 当输出。</text></g></svg>
