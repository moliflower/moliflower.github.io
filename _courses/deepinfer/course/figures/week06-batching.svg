<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="title desc"><title id="title">固定批次与连续批次对照</title><desc id="desc">相同请求A和B在0到达，C在1到达。固定批次C在4准入，连续批次C在1准入，首输出时间分别5和2。</desc><rect width="600" height="840" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="28" y="42" font-size="24" fill="#172b4d" text-anchor="start">同负载，只改变“是否及时补位”</text><text x="28" y="78" font-size="20" fill="#172b4d" text-anchor="start">A=(0,1,1)  B=(0,1,4)  C=(1,1,2)</text><text x="28" y="110" font-size="20" fill="#172b4d" text-anchor="start">参数：并发 2；预算 2；chunk 1</text><rect x="22" y="136" width="556" height="270" rx="12" fill="#edf2f7"/><text x="40" y="171" font-size="23" fill="#172b4d" text-anchor="start">固定批次：整组结束后才补位</text><text x="126" y="211" font-size="20" fill="#334e68" text-anchor="middle">0→1</text><text x="198" y="211" font-size="20" fill="#334e68" text-anchor="middle">1→2</text><text x="270" y="211" font-size="20" fill="#334e68" text-anchor="middle">2→3</text><text x="342" y="211" font-size="20" fill="#334e68" text-anchor="middle">3→4</text><text x="414" y="211" font-size="20" fill="#334e68" text-anchor="middle">4→5</text><text x="486" y="211" font-size="20" fill="#334e68" text-anchor="middle">5→6</text><text x="50" y="258" font-size="23" fill="#172b4d" text-anchor="start">A</text><rect x="96" y="227" width="60" height="40" rx="12" fill="#cfe2ff"/><text x="126" y="255" font-size="22" fill="#172b4d" text-anchor="middle">P</text><rect x="168" y="227" width="60" height="40" rx="12" fill="#fff"/><text x="198" y="255" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="240" y="227" width="60" height="40" rx="12" fill="#fff"/><text x="270" y="255" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="312" y="227" width="60" height="40" rx="12" fill="#fff"/><text x="342" y="255" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="384" y="227" width="60" height="40" rx="12" fill="#fff"/><text x="414" y="255" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="456" y="227" width="60" height="40" rx="12" fill="#fff"/><text x="486" y="255" font-size="22" fill="#172b4d" text-anchor="middle">·</text><text x="50" y="306" font-size="23" fill="#172b4d" text-anchor="start">B</text><rect x="96" y="275" width="60" height="40" rx="12" fill="#cfe2ff"/><text x="126" y="303" font-size="22" fill="#172b4d" text-anchor="middle">P</text><rect x="168" y="275" width="60" height="40" rx="12" fill="#bce7db"/><text x="198" y="303" font-size="22" fill="#172b4d" text-anchor="middle">D</text><rect x="240" y="275" width="60" height="40" rx="12" fill="#bce7db"/><text x="270" y="303" font-size="22" fill="#172b4d" text-anchor="middle">D</text><rect x="312" y="275" width="60" height="40" rx="12" fill="#bce7db"/><text x="342" y="303" font-size="22" fill="#172b4d" text-anchor="middle">D</text><rect x="384" y="275" width="60" height="40" rx="12" fill="#fff"/><text x="414" y="303" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="456" y="275" width="60" height="40" rx="12" fill="#fff"/><text x="486" y="303" font-size="22" fill="#172b4d" text-anchor="middle">·</text><text x="50" y="354" font-size="23" fill="#172b4d" text-anchor="start">C</text><rect x="96" y="323" width="60" height="40" rx="12" fill="#fff"/><text x="126" y="351" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="168" y="323" width="60" height="40" rx="12" fill="#ffdfac"/><text x="198" y="351" font-size="22" fill="#172b4d" text-anchor="middle">等</text><rect x="240" y="323" width="60" height="40" rx="12" fill="#ffdfac"/><text x="270" y="351" font-size="22" fill="#172b4d" text-anchor="middle">等</text><rect x="312" y="323" width="60" height="40" rx="12" fill="#ffdfac"/><text x="342" y="351" font-size="22" fill="#172b4d" text-anchor="middle">等</text><rect x="384" y="323" width="60" height="40" rx="12" fill="#cfe2ff"/><text x="414" y="351" font-size="22" fill="#172b4d" text-anchor="middle">P</text><rect x="456" y="323" width="60" height="40" rx="12" fill="#bce7db"/><text x="486" y="351" font-size="22" fill="#172b4d" text-anchor="middle">D</text><text x="40" y="388" font-size="20" fill="#172b4d" text-anchor="start">C 输出 [5,6]；TTFT = 5 − 1 = 4 tick</text><rect x="22" y="426" width="556" height="270" rx="12" fill="#edf2f7"/><text x="40" y="461" font-size="23" fill="#172b4d" text-anchor="start">连续批次：下一轮补入 C</text><text x="126" y="501" font-size="20" fill="#334e68" text-anchor="middle">0→1</text><text x="198" y="501" font-size="20" fill="#334e68" text-anchor="middle">1→2</text><text x="270" y="501" font-size="20" fill="#334e68" text-anchor="middle">2→3</text><text x="342" y="501" font-size="20" fill="#334e68" text-anchor="middle">3→4</text><text x="414" y="501" font-size="20" fill="#334e68" text-anchor="middle">4→5</text><text x="486" y="501" font-size="20" fill="#334e68" text-anchor="middle">5→6</text><text x="50" y="548" font-size="23" fill="#172b4d" text-anchor="start">A</text><rect x="96" y="517" width="60" height="40" rx="12" fill="#cfe2ff"/><text x="126" y="545" font-size="22" fill="#172b4d" text-anchor="middle">P</text><rect x="168" y="517" width="60" height="40" rx="12" fill="#fff"/><text x="198" y="545" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="240" y="517" width="60" height="40" rx="12" fill="#fff"/><text x="270" y="545" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="312" y="517" width="60" height="40" rx="12" fill="#fff"/><text x="342" y="545" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="384" y="517" width="60" height="40" rx="12" fill="#fff"/><text x="414" y="545" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="456" y="517" width="60" height="40" rx="12" fill="#fff"/><text x="486" y="545" font-size="22" fill="#172b4d" text-anchor="middle">·</text><text x="50" y="596" font-size="23" fill="#172b4d" text-anchor="start">B</text><rect x="96" y="565" width="60" height="40" rx="12" fill="#cfe2ff"/><text x="126" y="593" font-size="22" fill="#172b4d" text-anchor="middle">P</text><rect x="168" y="565" width="60" height="40" rx="12" fill="#bce7db"/><text x="198" y="593" font-size="22" fill="#172b4d" text-anchor="middle">D</text><rect x="240" y="565" width="60" height="40" rx="12" fill="#bce7db"/><text x="270" y="593" font-size="22" fill="#172b4d" text-anchor="middle">D</text><rect x="312" y="565" width="60" height="40" rx="12" fill="#bce7db"/><text x="342" y="593" font-size="22" fill="#172b4d" text-anchor="middle">D</text><rect x="384" y="565" width="60" height="40" rx="12" fill="#fff"/><text x="414" y="593" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="456" y="565" width="60" height="40" rx="12" fill="#fff"/><text x="486" y="593" font-size="22" fill="#172b4d" text-anchor="middle">·</text><text x="50" y="644" font-size="23" fill="#172b4d" text-anchor="start">C</text><rect x="96" y="613" width="60" height="40" rx="12" fill="#fff"/><text x="126" y="641" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="168" y="613" width="60" height="40" rx="12" fill="#cfe2ff"/><text x="198" y="641" font-size="22" fill="#172b4d" text-anchor="middle">P</text><rect x="240" y="613" width="60" height="40" rx="12" fill="#bce7db"/><text x="270" y="641" font-size="22" fill="#172b4d" text-anchor="middle">D</text><rect x="312" y="613" width="60" height="40" rx="12" fill="#fff"/><text x="342" y="641" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="384" y="613" width="60" height="40" rx="12" fill="#fff"/><text x="414" y="641" font-size="22" fill="#172b4d" text-anchor="middle">·</text><rect x="456" y="613" width="60" height="40" rx="12" fill="#fff"/><text x="486" y="641" font-size="22" fill="#172b4d" text-anchor="middle">·</text><text x="40" y="678" font-size="20" fill="#172b4d" text-anchor="start">C 输出 [2,3]；TTFT = 2 − 1 = 1 tick</text><text x="30" y="738" font-size="20" fill="#172b4d" text-anchor="start">P：prefill；D：decode；等：已到达未准入</text><text x="30" y="777" font-size="20" fill="#172b4d" text-anchor="start">每轮固定 1 tick。两边均可及时返回完成者。</text><text x="30" y="813" font-size="20" fill="#172b4d" text-anchor="start">这里不比较 GPU 物理时间，不改变请求输入。</text></g></svg>
