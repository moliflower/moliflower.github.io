<svg xmlns="http://www.w3.org/2000/svg" width="600" height="852" viewBox="0 0 600 852" role="img" aria-labelledby="title desc"><title id="title">Attention物化与分块IO对照</title><desc id="desc">完整S/P产生四次跨HBM读写；分块将局部分数和状态留在片上，但K/V仍可能被多个Q tile重读。</desc><rect width="600" height="852" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="28" y="44" font-size="24" fill="#17324d" text-anchor="start">IO 账本：省掉什么，又保留什么？</text><rect x="26" y="76" width="548" height="282" rx="12" fill="#edf2f7"/><text x="46" y="111" font-size="23" fill="#17324d" text-anchor="start">三阶段物化：完整 S/P 经过 HBM</text><text x="48" y="157" font-size="21" fill="#17324d" text-anchor="start">计算 S → 写 S 到 HBM</text><text x="48" y="204" font-size="21" fill="#17324d" text-anchor="start">读 S → Softmax → 写 P 到 HBM</text><text x="48" y="251" font-size="21" fill="#17324d" text-anchor="start">读 P → 乘 V → 输出 O</text><text x="46" y="303" font-size="20" fill="#17324d" text-anchor="start">S 写/读 + P 写/读：共 4N² 次元素访问</text><text x="46" y="337" font-size="20" fill="#17324d" text-anchor="start">单张 S 的容量只有 N² 个元素。</text><rect x="26" y="386" width="548" height="285" rx="12" fill="#ddf3e9"/><text x="46" y="424" font-size="22" fill="#17324d" text-anchor="start">分块：小 S tile 留在片上，不写全矩阵</text><text x="48" y="472" font-size="21" fill="#17324d" text-anchor="start">HBM：读取 Q tile、K tile、V tile</text><text x="48" y="519" font-size="21" fill="#17324d" text-anchor="start">片上：局部分数 → 更新 m、s、o</text><text x="48" y="566" font-size="21" fill="#17324d" text-anchor="start">扫描完 K/V → output=o/s → 写 O</text><text x="48" y="620" font-size="20" fill="#17324d" text-anchor="start">下一个 Q tile 仍可能重读同一批 K/V。</text><rect x="26" y="699" width="548" height="122" rx="12" fill="#fff0d5"/><text x="46" y="735" font-size="20" fill="#17324d" text-anchor="start">示例 N=4096，d=64，单头，2B/元素</text><text x="46" y="770" font-size="20" fill="#17324d" text-anchor="start">S 容量 32 MiB；S/P 四次流量 128 MiB</text><text x="46" y="804" font-size="20" fill="#17324d" text-anchor="start">理想输入读写 2 MiB ≠ 实际 tiled 流量</text></g></svg>
