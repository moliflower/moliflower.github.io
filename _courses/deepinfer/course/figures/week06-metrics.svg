<svg xmlns="http://www.w3.org/2000/svg" width="600" height="744" viewBox="0 0 600 744" role="img" aria-labelledby="title desc"><title id="title">延迟指标的时间线推导</title><desc id="desc">到达时刻2，输出时刻5、7、11。TTFT3，ITL2和4，TPOT3，E2E9。</desc><rect width="600" height="744" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="28" y="45" font-size="24" fill="#172b4d" text-anchor="start">先标事件，再计算延迟</text><text x="28" y="85" font-size="20" fill="#172b4d" text-anchor="start">同一时钟；本图单位为 tick</text><path d="M 62 175 L 540 175" stroke="#47647b" stroke-width="3" fill="none"/><circle cx="62" cy="175" r="7" fill="#1769aa"/><text x="62" y="147" font-size="20" fill="#172b4d" text-anchor="middle">到达</text><text x="62" y="212" font-size="22" fill="#172b4d" text-anchor="middle">2</text><circle cx="221" cy="175" r="7" fill="#1769aa"/><text x="221" y="147" font-size="20" fill="#172b4d" text-anchor="middle">首输出</text><text x="221" y="212" font-size="22" fill="#172b4d" text-anchor="middle">5</text><circle cx="327" cy="175" r="7" fill="#1769aa"/><text x="327" y="147" font-size="20" fill="#172b4d" text-anchor="middle">输出2</text><text x="327" y="212" font-size="22" fill="#172b4d" text-anchor="middle">7</text><circle cx="539" cy="175" r="7" fill="#1769aa"/><text x="539" y="147" font-size="20" fill="#172b4d" text-anchor="middle">输出3</text><text x="539" y="212" font-size="22" fill="#172b4d" text-anchor="middle">11</text><rect x="28" y="248" width="544" height="88" rx="12" fill="#fff0d8"/><text x="48" y="281" font-size="22" fill="#172b4d" text-anchor="start">TTFT：首输出 − 到达</text><text x="48" y="315" font-size="22" fill="#172b4d" text-anchor="start">5 − 2 = 3</text><rect x="28" y="354" width="544" height="110" rx="12" fill="#e2efff"/><text x="48" y="388" font-size="22" fill="#172b4d" text-anchor="start">ITL：[7 − 5，11 − 7] = [2，4]</text><text x="48" y="425" font-size="22" fill="#172b4d" text-anchor="start">TPOT：(2 + 4) / 2 = 3</text><rect x="28" y="482" width="544" height="110" rx="12" fill="#dff3ea"/><text x="48" y="516" font-size="21" fill="#172b4d" text-anchor="start">E2E：最后输出 − 到达 = 11 − 2 = 9</text><text x="48" y="554" font-size="21" fill="#172b4d" text-anchor="start">一致性检查：3 + (3 − 1) × 3 = 9</text><text x="30" y="636" font-size="20" fill="#172b4d" text-anchor="start">3 个输出只有 2 个间隔；不要除以 3。</text><text x="30" y="675" font-size="20" fill="#172b4d" text-anchor="start">单输出没有间隔：TPOT = None，不是 0。</text><text x="30" y="714" font-size="20" fill="#172b4d" text-anchor="start">平均间隔为 3，不代表每个间隔都是 3。</text></g></svg>
