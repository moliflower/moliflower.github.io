<svg xmlns="http://www.w3.org/2000/svg" width="600" height="846" viewBox="0 0 600 846" role="img" aria-labelledby="title desc"><title id="title">在线Attention两个tile合并</title><desc id="desc">前两项状态m为ln2、s为1.5、o为7。新最大值ln4使旧s和o同乘二分之一，加入新项后s1.75、o13.5，输出54/7。</desc><rect width="600" height="846" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="28" y="44" font-size="24" fill="#17324d" text-anchor="start">在线状态：分子和分母一起重缩放</text><text x="28" y="84" font-size="20" fill="#17324d" text-anchor="start">logits=[0,ln2,ln4]；values=[2,6,10]</text><rect x="26" y="114" width="548" height="132" rx="12" fill="#e1edff"/><text x="46" y="150" font-size="22" fill="#17324d" text-anchor="start">Tile A：前两项</text><text x="46" y="189" font-size="20" fill="#17324d" text-anchor="start">m=ln2；s=1/2+1=1.5</text><text x="46" y="226" font-size="20" fill="#17324d" text-anchor="start">o=(1/2)×2+6=7</text><path d="M 300 246 L 300 277" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="277" width="548" height="132" rx="12" fill="#fff0d5"/><text x="46" y="313" font-size="22" fill="#17324d" text-anchor="start">新最大值 ln4：先改旧基准</text><text x="46" y="352" font-size="20" fill="#17324d" text-anchor="start">alpha=exp(ln2−ln4)=1/2</text><text x="46" y="389" font-size="20" fill="#17324d" text-anchor="start">s旧→0.75；o旧→3.5</text><path d="M 300 409 L 300 440" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="440" width="548" height="132" rx="12" fill="#ddf3e9"/><text x="46" y="476" font-size="22" fill="#17324d" text-anchor="start">Tile B：加入第三项</text><text x="46" y="515" font-size="20" fill="#17324d" text-anchor="start">新权重 exp(ln4−ln4)=1</text><text x="46" y="552" font-size="20" fill="#17324d" text-anchor="start">s=0.75+1=1.75；o=3.5+10=13.5</text><path d="M 300 572 L 300 603" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="603" width="548" height="132" rx="12" fill="#e1edff"/><text x="46" y="639" font-size="22" fill="#17324d" text-anchor="start">全部处理完：只在最后归一化</text><text x="46" y="678" font-size="20" fill="#17324d" text-anchor="start">output=o/s=13.5/1.75=54/7</text><text x="46" y="715" font-size="20" fill="#17324d" text-anchor="start">稠密核对：(2+12+40)/(1+2+4)=54/7</text><text x="30" y="778" font-size="20" fill="#17324d" text-anchor="start">m：最大值；s：分母；o：未归一化分子</text><text x="30" y="817" font-size="20" fill="#17324d" text-anchor="start">o 不等于 output；两者不要用同一个名字。</text></g></svg>
