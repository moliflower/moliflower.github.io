<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="title desc"><title id="title">请求生命周期</title><desc id="desc">等待后准入；prefill结束发出首token；若还需输出则逐轮decode，否则直接完成。轮末完成，下轮补位。</desc><rect width="600" height="840" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="30" y="44" font-size="24" fill="#172b4d" text-anchor="start">请求生命周期：一轮只决策一次</text><rect x="26" y="76" width="548" height="86" rx="12" fill="#fff0d8"/><text x="46" y="109" font-size="22" fill="#172b4d" text-anchor="start">1  等待队列：已到达，未准入</text><text x="46" y="141" font-size="20" fill="#172b4d" text-anchor="start">轮开始 t：有请求位置才进入 active</text><rect x="26" y="190" width="548" height="86" rx="12" fill="#e2efff"/><text x="46" y="223" font-size="22" fill="#172b4d" text-anchor="start">2  Prefill：处理剩余 prompt</text><text x="46" y="255" font-size="20" fill="#172b4d" text-anchor="start">每轮最多一个 chunk；未结束则继续</text><rect x="26" y="304" width="548" height="86" rx="12" fill="#dff3ea"/><text x="46" y="337" font-size="22" fill="#172b4d" text-anchor="start">3  完整 prompt 处理结束</text><text x="46" y="369" font-size="20" fill="#172b4d" text-anchor="start">轮末 t+1：产生首 token，输出余量减 1</text><rect x="26" y="480" width="548" height="86" rx="12" fill="#e2efff"/><text x="46" y="513" font-size="22" fill="#172b4d" text-anchor="start">4  Decode：每轮再产生一个输出</text><text x="46" y="545" font-size="20" fill="#172b4d" text-anchor="start">输出余量仍大于 0，下一轮继续</text><rect x="26" y="638" width="548" height="86" rx="12" fill="#dff3ea"/><text x="46" y="671" font-size="22" fill="#172b4d" text-anchor="start">5  完成：移出 active</text><text x="46" y="703" font-size="20" fill="#172b4d" text-anchor="start">轮末释放位置；等待者下一轮才补位</text><path d="M 300 162 L 300 190" stroke="#47647b" stroke-width="3" fill="none"/><path d="M 300 276 L 300 304" stroke="#47647b" stroke-width="3" fill="none"/><path d="M 300 390 L 300 480" stroke="#47647b" stroke-width="3" fill="none"/><text x="316" y="438" font-size="20" fill="#172b4d" text-anchor="start">仍需输出</text><path d="M 300 566 L 300 638" stroke="#47647b" stroke-width="3" fill="none"/><text x="316" y="604" font-size="20" fill="#172b4d" text-anchor="start">输出余量 = 0</text><path d="M 62 390 L 62 445 L 16 445 L 16 610 L 62 610 L 62 638" fill="none" stroke="#138468" stroke-width="3"/><text x="80" y="418" font-size="20" fill="#116b53" text-anchor="start">输出总数 = 1</text><text x="80" y="454" font-size="20" fill="#116b53" text-anchor="start">跳过 Decode</text><text x="30" y="772" font-size="20" fill="#172b4d" text-anchor="start">请求位置 ≠ 本轮 token 预算 ≠ KV 容量</text><text x="30" y="808" font-size="20" fill="#172b4d" text-anchor="start">这是固定 tick 模型，不包含真实设备执行。</text></g></svg>
