<svg xmlns="http://www.w3.org/2000/svg" width="620" height="450" viewBox="0 0 620 450" role="img" aria-labelledby="title desc">
<title id="title">连续地址的sector与line数量</title>
<desc id="desc">从word0开始的32个word覆盖sector0到3；从word1开始覆盖sector0到4；从word16开始覆盖sector2到5。后两者都跨两个line，但sector数量不同。</desc>
<rect width="620" height="450" rx="20" fill="#f3f6fb"/>
<g font-family="sans-serif" font-size="22" fill="#18304b">
<text x="26" y="42" font-size="26" font-weight="700">每格一个32B sector（8个word）</text>
<text x="28" y="82">word 0–31：1 line，4 sectors</text>
<g fill="#d5e8fb" stroke="#6989ac"><rect x="28" y="98" width="88" height="44"/><rect x="116" y="98" width="88" height="44"/><rect x="204" y="98" width="88" height="44"/><rect x="292" y="98" width="88" height="44"/></g>
<text x="62" y="128">0</text><text x="150" y="128">1</text><text x="238" y="128">2</text><text x="326" y="128">3</text>
<text x="28" y="189">word 1–32：2 lines，5 sectors</text>
<g fill="#ffe6b9" stroke="#ae8542"><rect x="28" y="205" width="88" height="44"/><rect x="116" y="205" width="88" height="44"/><rect x="204" y="205" width="88" height="44"/><rect x="292" y="205" width="88" height="44"/><rect x="380" y="205" width="88" height="44"/></g>
<text x="62" y="235">0</text><text x="150" y="235">1</text><text x="238" y="235">2</text><text x="326" y="235">3</text><text x="414" y="235">4</text>
<text x="28" y="296">word 16–47：2 lines，4 sectors</text>
<g fill="#c9e9de" stroke="#508b79"><rect x="28" y="312" width="88" height="44"/><rect x="116" y="312" width="88" height="44"/><rect x="204" y="312" width="88" height="44"/><rect x="292" y="312" width="88" height="44"/></g>
<text x="62" y="342">2</text><text x="150" y="342">3</text><text x="238" y="342">4</text><text x="326" y="342">5</text>
<text x="28" y="400">编号 = word地址 // 8</text>
<text x="28" y="432">各行有用数据均为128B；覆盖不同</text>
</g></svg>
