<svg xmlns="http://www.w3.org/2000/svg" width="620" height="514" viewBox="0 0 620 514" role="img" aria-labelledby="title desc">
<title id="title">Online softmax如何换基准</title>
<desc id="desc">读入0后m为0、s为1。读ln2时旧和乘二分之一再加1，s为1.5。读ln4时旧和再次乘二分之一再加1，s为1.75。最后每个指数权重除以1.75。</desc>
<rect width="620" height="514" rx="20" fill="#f3f6fb"/>
<g font-family="sans-serif" font-size="22" fill="#18304b">
<text x="28" y="42" font-size="26" font-weight="700">最大值变了，旧贡献不能丢</text>
<rect x="28" y="70" width="564" height="92" rx="12" fill="#deecfb"/>
<text x="46" y="105" font-weight="700">读入0：m = 0，s = 1</text>
<text x="46" y="140">权重：[1]</text>
<text x="280" y="192" font-size="26">↓</text>
<rect x="28" y="210" width="564" height="92" rx="12" fill="#c9e9de"/>
<text x="46" y="245" font-weight="700">读入ln2：m = ln2</text>
<text x="46" y="280">旧和1 × 1/2 + 新项1 = 1.5</text>
<text x="280" y="332" font-size="26">↓</text>
<rect x="28" y="350" width="564" height="92" rx="12" fill="#ffe6b9"/>
<text x="46" y="385" font-weight="700">读入ln4：m = ln4</text>
<text x="46" y="420">旧和1.5 × 1/2 + 新项1 = 1.75</text>
<text x="28" y="482">概率 = [1/4, 1/2, 1] / 1.75</text>
</g></svg>
