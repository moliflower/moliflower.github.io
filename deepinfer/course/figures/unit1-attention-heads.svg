<svg xmlns="http://www.w3.org/2000/svg" width="600" height="832" viewBox="0 0 600 832" role="img" aria-labelledby="title desc"><title id="title">Multi-head拆分与拼接</title><desc id="desc">两个head取连续列，分别使用自己的K/V和softmax分母，最终按head顺序拼接。</desc><rect width="600" height="832" rx="18" fill="#f8fafc"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="28" y="43" font-size="24" fill="#17324d" text-anchor="start">Multi-head：拆列，不拆 token</text><text x="28" y="81" font-size="20" fill="#17324d" text-anchor="start">本例：2 个 token，d_model=2，heads=2</text><rect x="26" y="109" width="548" height="114" rx="12" fill="#edf2f7"/><text x="46" y="143" font-size="20" fill="#17324d" text-anchor="start">Q=[[0,0],[1,1]]   K=[[0,0],[1,2]]</text><text x="46" y="181" font-size="20" fill="#17324d" text-anchor="start">V=[[2,10],[6,30]]；每头 d_head=1</text><path d="M 300 223 L 300 249" fill="none" stroke="#526b83" stroke-width="3"/><path d="M 154 249 L 446 249" fill="none" stroke="#526b83" stroke-width="3"/><path d="M 154 249 L 154 277" fill="none" stroke="#526b83" stroke-width="3"/><path d="M 446 249 L 446 277" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="277" width="258" height="271" rx="12" fill="#e1edff"/><text x="44" y="313" font-size="21" fill="#17324d" text-anchor="start">Head 0：第 0 列</text><text x="44" y="351" font-size="20" fill="#17324d" text-anchor="start">Q=[0,1]；K=[0,1]</text><text x="44" y="387" font-size="20" fill="#17324d" text-anchor="start">V=[2,6]</text><text x="44" y="425" font-size="20" fill="#17324d" text-anchor="start">第二行 logits=[0,1]</text><text x="44" y="466" font-size="20" fill="#17324d" text-anchor="start">各自 Softmax，再加权V</text><text x="44" y="512" font-size="20" fill="#17324d" text-anchor="start">(2+6e)/(1+e)</text><rect x="316" y="277" width="258" height="271" rx="12" fill="#ddf3e9"/><text x="334" y="313" font-size="21" fill="#17324d" text-anchor="start">Head 1：第 1 列</text><text x="334" y="351" font-size="20" fill="#17324d" text-anchor="start">Q=[0,1]；K=[0,2]</text><text x="334" y="387" font-size="20" fill="#17324d" text-anchor="start">V=[10,30]</text><text x="334" y="425" font-size="20" fill="#17324d" text-anchor="start">第二行 logits=[0,2]</text><text x="334" y="466" font-size="20" fill="#17324d" text-anchor="start">各自 Softmax，再加权V</text><text x="334" y="512" font-size="20" fill="#17324d" text-anchor="start">(10+30e²)/(1+e²)</text><path d="M 154 548 L 154 578" fill="none" stroke="#526b83" stroke-width="3"/><path d="M 446 548 L 446 578" fill="none" stroke="#526b83" stroke-width="3"/><path d="M 154 578 L 446 578" fill="none" stroke="#526b83" stroke-width="3"/><path d="M 300 578 L 300 605" fill="none" stroke="#526b83" stroke-width="3"/><rect x="26" y="605" width="548" height="114" rx="12" fill="#fff0d5"/><text x="46" y="642" font-size="22" fill="#17324d" text-anchor="start">Concat：按原 head 顺序放回列</text><text x="46" y="681" font-size="21" fill="#17324d" text-anchor="start">O = [[2,10],[4.924234,27.615942]]</text><text x="28" y="763" font-size="20" fill="#17324d" text-anchor="start">每头都保留两条 token 行；用自己的 √1。</text><text x="28" y="802" font-size="20" fill="#17324d" text-anchor="start">本 Lab 不含 Q/K/V 投影或输出投影。</text></g></svg>
